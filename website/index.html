<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="_css/style.css">
    <link rel="shortcut icon" href="_img/hand.png" type="image/x-icon">
    <title>Robotic Hand</title>
</head>

<body>
    <div class="cont-principal">
        <div class="cont-header">
            <p>Robotic Hand  |  ETEC da Zona Leste</p>
        </div>

        <div class="cont-esquerdo">
            <div class="painel">
                <div class="botoes">
                    <button>
                        <img src="_img/home.png" alt="">
                        <p>Home</p>
                    </button>

                    <button>
                        <img src="_img/palm-of-hand.png" alt="">
                        <p>Customize</p>
                    </button>

                    <button>
                        <img src="_img/volume-adjustment.png" alt="">
                        <p>Presets</p>
                    </button>

                    <button>
                        <img src="_img/settings.png" alt="">
                        <p>Settings</p>
                    </button>

                    <button>
                        <img src="_img/info.png" alt="">
                        <p>About Us</p>
                    </button>
                </div>
                <p class="rodape">By CHEB Labs <br> Educational purposes</p>
            </div>
        </div>

        <div class="cont-central">
            <div class="texto">
                <h2>POSITION</h2>
                <h1>OPEN HAND</h1>
            </div>

            <div class="img">
                <div class="medidor">
                    <img src="_img/Elipse.png" alt="">
                </div>
                <div class="mao">
                    <img src="_img/MaoAberta2.png" alt="">
                </div>
                <div class="porcentagem">
                    <img src="_img/battery.png" alt="">
                    <p>37%</p>
                </div>
            </div>

        </div>

        <div class="cont-botoes">
            <div class="fnd-botao"><button data-dedo="0"><img src="_img/MaoAberta2.png" alt=""><p>Open</p></button></div>
            <div class="fnd-botao"><button data-dedo="1"><img src="_img/MaoAberta2.png" alt=""><p>Closed</p></button></div>
            <div class="fnd-botao"><button data-dedo="2"><img src="_img/MaoAberta2.png" alt=""><p>Rock 'n Roll</p></button></div>
            <div class="fnd-botao"><button data-dedo="3"><img src="_img/MaoAberta2.png" alt=""><p>Thumbs Up</p></button></div>
            <div class="fnd-botao"><button data-dedo="4"><img src="_img/MaoAberta2.png" alt=""><p>OK</p></button></div>
        </div>

        <div class="cont-direito1">
            <div class="painel">
                <div class="range">
                    <p>Thumb</p>
                    <input type="range" name="" id="slider-0" class="slider" data-dedo="0">
                </div>
                <div class="range">
                    <p>Index</p>
                    <input type="range" name="" id="slider-1" class="slider" data-dedo="1">
                </div>
                <div class="range">
                    <p>Middle</p>
                    <input type="range" name="" id="slider-2" class="slider" data-dedo="2">
                </div>
                <div class="range">
                    <p>Ring</p>
                    <input type="range" name="" id="slider-3" class="slider" data-dedo="3">
                </div>
                <div class="range">
                    <p>Pinky</p>
                    <input type="range" name="" id="slider-4" class="slider" data-dedo="4">
                </div>
            </div>
        </div>

        <div class="cont-direito2">
            <div class="painel">
                <h1>ESP32</h1>
                <p style="font-size: 0.6em; font-weight: 200; color: #b5b5b5;">Microcontroller Status</p>
                <div class="info" style="margin-top: 16px;">
                    <img src="_img/wifi.png" alt=""><p><strong>IP:</strong> 192.168.4.1</p>
                </div>
                <div class="info">
                    <img src="_img/signal-status.png" alt=""><p><strong>Signal:</strong> -54 dBm</p>
                </div>
                <div class="info">
                    <img src="_img/gears.png" alt=""><p><Strong>Servos:</Strong> 5/5</p>
                </div>
            </div>
        </div>
    </div>

    <script src="_js/script.js"></script>
</body>

</html>
